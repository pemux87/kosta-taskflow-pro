<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro</title>

  <!-- FOUC 방지: DOM 로드 전 테마 적용 -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const prefer = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if ((saved ?? prefer) === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- Tailwind CDN (Play CDN — JIT 포함) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', "'Segoe UI'", 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="font-sans min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200">

  <!-- 헤더 -->
  <header class="sticky top-0 z-10 backdrop-blur-md bg-white/70 dark:bg-gray-800/70 border-b border-gray-200 dark:border-gray-700 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-semibold tracking-tight">TaskFlow Pro</h1>
      <button
        id="theme-toggle"
        class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
        aria-label="테마 전환"
      >🌙</button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

    <!-- 태스크 추가 폼 -->
    <section class="backdrop-blur-md bg-white/70 dark:bg-gray-800/70 rounded-xl shadow-lg p-5 border border-gray-200 dark:border-gray-700">
      <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">새 태스크</h2>
      <form id="add-form" class="space-y-3">
        <input
          id="add-title"
          type="text"
          placeholder="태스크 제목 (필수)"
          maxlength="200"
          required
          class="w-full min-h-[44px] px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:focus:ring-blue-500 transition"
        />
        <div class="flex gap-3 flex-wrap">
          <input
            id="add-due-at"
            type="datetime-local"
            class="flex-1 min-w-[160px] min-h-[44px] px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:focus:ring-blue-500 transition"
          />
          <select
            id="add-status"
            class="min-h-[44px] px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 dark:focus:ring-blue-500 transition"
          >
            <option value="todo">할 일</option>
            <option value="in_progress">진행 중</option>
            <option value="done">완료</option>
          </select>
          <button
            type="submit"
            class="min-h-[44px] px-5 py-2 rounded-xl bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-medium transition-colors shadow-sm"
          >추가</button>
        </div>
      </form>
    </section>

    <!-- 태스크 목록 -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">태스크 목록</h2>
        <span id="task-count" class="text-xs text-gray-400 dark:text-gray-500"></span>
      </div>
      <div id="task-list" class="space-y-3"></div>
      <p id="empty-msg" class="hidden text-center text-gray-400 dark:text-gray-500 py-12 text-sm">태스크가 없습니다.</p>
    </section>

  </main>

  <!-- 수정 모달 -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" id="modal-backdrop"></div>
    <div class="relative w-full max-w-md backdrop-blur-md bg-white/90 dark:bg-gray-800/90 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 p-6 space-y-4">
      <h3 class="font-semibold text-base">태스크 수정</h3>
      <form id="edit-form" class="space-y-3">
        <input type="hidden" id="edit-id" />
        <input
          id="edit-title"
          type="text"
          placeholder="제목"
          maxlength="200"
          required
          class="w-full min-h-[44px] px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
        />
        <textarea
          id="edit-description"
          placeholder="설명 (선택)"
          rows="3"
          class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition resize-none"
        ></textarea>
        <div class="flex gap-3">
          <input
            id="edit-due-at"
            type="datetime-local"
            class="flex-1 min-h-[44px] px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          />
          <select
            id="edit-status"
            class="min-h-[44px] px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          >
            <option value="todo">할 일</option>
            <option value="in_progress">진행 중</option>
            <option value="done">완료</option>
          </select>
        </div>
        <div class="flex gap-3 pt-1">
          <button
            type="button"
            id="modal-cancel"
            class="flex-1 min-h-[44px] rounded-xl border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
          >취소</button>
          <button
            type="submit"
            class="flex-1 min-h-[44px] rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-medium transition-colors"
          >저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
